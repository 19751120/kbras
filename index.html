<style>
:root{
  --pasto:#2F5D3A; --pasto2:#3F7A4C; --heno:#F2C14E; --heno2:#D9A12E;
  --tiza:#EEF2E6; --papel:#FFFFFF; --tinta:#1C2620; --suave:#5B685D; --linea:#D3DBCB;
  --rojo:#B83A28; --cielo:#BFE0F0; --warnbg:#FFF1C9; --warnfg:#5B4300; --accent:var(--pasto);
  --disp:'Bowlby One','Arial Black',Impact,sans-serif;
  --txt:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--tiza:#122019;--papel:#1C2B22;--tinta:#E7EEE2;--suave:#A0AFA3;--linea:#2D4035;--pasto:#22452B;--pasto2:#35693F;--cielo:#22394A;--warnbg:#3D3112;--warnfg:#F5DD98;--accent:var(--heno)}
}
:root[data-theme="dark"]{--tiza:#122019;--papel:#1C2B22;--tinta:#E7EEE2;--suave:#A0AFA3;--linea:#2D4035;--pasto:#22452B;--pasto2:#35693F;--cielo:#22394A;--warnbg:#3D3112;--warnfg:#F5DD98;--accent:var(--heno)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--tiza);color:var(--tinta);font-family:var(--txt);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
#app{max-width:560px;margin:0 auto}
main{padding:16px 16px 48px}
h1,h2,h3{font-family:var(--disp);font-weight:400;line-height:1.05;margin:0}
h2{font-size:1.5rem;margin-bottom:6px}
h3{font-size:1.1rem}
p{margin:0 0 10px}
.muted{color:var(--suave)}
.small{font-size:.875rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--heno);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px 18px;font-weight:800;font-size:1.05rem;background:var(--heno);color:#1C2620;box-shadow:0 4px 0 var(--heno2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--heno2)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--heno2)}
.btn.sec{background:transparent;color:var(--tinta);box-shadow:inset 0 0 0 2px var(--linea)}
.btn.sec:active{transform:translateY(1px)}
.btn.dark{background:var(--pasto);color:#fff;box-shadow:0 4px 0 #173020}
.row{display:flex;gap:10px;align-items:center}
.stack>*+*{margin-top:12px}
.panel{background:var(--papel);border-radius:18px;padding:16px;border:1px solid var(--linea)}
label.f{display:block;font-weight:800;font-size:.9rem;margin-bottom:6px}
input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:2px solid var(--linea);background:var(--papel);color:var(--tinta)}
textarea{min-height:150px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--pasto2);height:32px}

/* Home */
.home{padding:28px 20px 40px}
.brand{font-family:var(--disp);font-size:clamp(3.2rem,17vw,5.4rem);line-height:.88;color:var(--accent);letter-spacing:-.01em;margin:8px 0 6px}
.brand span{display:block}
.brand .goat{font-size:.7em}
.lede{font-size:1.05rem;color:var(--suave);max-width:34ch;margin-bottom:26px}
.tabs{display:flex;background:var(--papel);border:1px solid var(--linea);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:800;color:var(--suave)}
.tabs button[aria-selected=true]{background:var(--pasto);color:#fff}
.code-input{text-transform:uppercase;letter-spacing:.3em;font-family:var(--disp);font-size:1.6rem!important;text-align:center}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--pasto);color:#fff;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));display:flex;align-items:center;gap:12px}
.top .code{font-family:var(--disp);font-size:1.1rem;letter-spacing:.12em;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:8px}
.top .phase{font-weight:800;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .clock{font-family:var(--disp);font-size:1.5rem;min-width:2.6ch;text-align:right;color:var(--heno)}
.top .clock.low{color:#FF9B85}
.dot{width:10px;height:10px;border-radius:50%;background:#7CE38B;flex:none}
.dot.off{background:#FF8A75;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.pausebtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:.85rem}
.paused-banner{background:var(--heno);color:#1C2620;text-align:center;font-weight:800;padding:8px}

/* Lobby */
.bigcode{font-family:var(--disp);font-size:3.4rem;letter-spacing:.14em;color:var(--accent);text-align:center;line-height:1;margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tiza);border:1px solid var(--linea);border-radius:999px;padding:5px 11px;font-weight:600;font-size:.9rem}
.chip.me{background:var(--heno);border-color:var(--heno2);color:#1C2620}
.chip.slot{border-style:dashed;color:var(--suave);background:transparent}
.chip.off{opacity:.5;text-decoration:line-through}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:.9rem;font-weight:600}
.hint.bad{color:var(--rojo)}

/* Rating */
.rate{padding:12px 0;border-bottom:1px solid var(--linea)}
.rate:last-child{border-bottom:0}
.rate-head{display:flex;align-items:center;gap:10px}
.rate-name{flex:1;font-weight:800;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.rate-val{font-family:var(--disp);font-size:1.4rem;min-width:2.2ch;text-align:center}
.rate.unset .rate-val{color:var(--suave)}
.rate.unset input[type=range]{opacity:.35}
.linkbtn{border:0;background:none;color:var(--suave);font-size:.85rem;text-decoration:underline;padding:4px}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--suave);padding:0 4px}
.locked input,.locked .linkbtn{pointer-events:none}
.sticky-foot{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--tiza) 30%)}

/* Wheel */
.wheel-wrap{position:relative;width:min(84vw,330px);aspect-ratio:1;margin:8px auto 4px}
.wheel-wrap svg{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 6px var(--pasto),0 10px 30px rgba(0,0,0,.25)}
.wheel-rot{width:100%;height:100%;will-change:transform}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--rojo);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
.lot{text-align:center;padding:18px 12px}
.lot .kicker{color:var(--suave);font-weight:700;font-size:.95rem}
.lot .name{font-family:var(--disp);font-size:clamp(2rem,10vw,3rem);line-height:1;margin:6px 0 10px;overflow-wrap:anywhere}
.bidline{font-size:1.1rem}
.bidline b{font-family:var(--disp);font-weight:400;font-size:1.6rem}
.bar{height:10px;border-radius:99px;background:var(--linea);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--pasto2);width:100%;transition:width .2s linear}
.bar.low i{background:var(--rojo)}
.yourturn{background:var(--cielo);border:2px solid var(--pasto2)}
.stepper{display:flex;align-items:center;gap:10px;margin:10px 0}
.stepper button{width:56px;height:56px;border-radius:14px;border:2px solid var(--linea);background:var(--papel);font-size:1.6rem;font-weight:800}
.stepper .amt{flex:1;text-align:center;font-family:var(--disp);font-size:2.4rem}
.teams .pl{padding:12px 0;border-bottom:1px solid var(--linea)}
.teams .pl:last-child{border-bottom:0}
.pl-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.pl-name{font-weight:800;flex:1;min-width:0;overflow-wrap:anywhere}
.pl-goats{font-family:var(--disp);font-size:1.15rem;white-space:nowrap}
.tag{font-size:.75rem;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--tiza);color:var(--suave);white-space:nowrap}
.tag.turn{background:var(--heno);color:#1C2620}
.tag.lead{background:var(--pasto2);color:#fff}
.hist li{padding:6px 0;border-bottom:1px dashed var(--linea);font-size:.92rem}
.hist ul{list-style:none;margin:0;padding:0}
.warn{background:var(--warnbg);color:var(--warnfg);border-radius:12px;padding:10px 12px;font-weight:600;font-size:.92rem}

/* Results */
.res{list-style:none;margin:0;padding:0}
.res li{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;opacity:0;transform:translateY(12px) scale(.98);transition:opacity .5s,transform .5s}
.res li.show{opacity:1;transform:none}
.res li.win{border:3px solid var(--heno);background:linear-gradient(180deg,rgba(242,193,78,.18),transparent)}
.pos{font-family:var(--disp);font-size:2rem;color:var(--pasto2);grid-row:span 2}
.res .nm{font-weight:800;font-size:1.1rem}
.res .fin{font-family:var(--disp);font-size:1.9rem;text-align:right;grid-row:span 2}
.res .det{font-size:.85rem;color:var(--suave);grid-column:2}
.res .tm{grid-column:1/-1;font-size:.88rem}
.oracle{text-align:center;opacity:0;transition:opacity .6s}
.oracle.show{opacity:1}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:.88rem;min-width:100%}
th,td{padding:7px 9px;border-bottom:1px solid var(--linea);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--papel)}
tr.real td{font-weight:800}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--tinta);color:var(--tiza);padding:11px 16px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
const PREFIX = 'lascabras-v1-';
const SPIN_MS = 4500, TURN_MS = 10000, SOLD_MS = 5000, PRE_MS = 3000, PRED_MS = 60000, RATE_PER = 10000;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d = 2) => n == null ? '—' : Number(n).toLocaleString('es-ES', {minimumFractionDigits: d, maximumFractionDigits: d});
const avg = a => a.reduce((x, y) => x + y, 0) / a.length;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Math.random().toString(36).slice(2, 10);
const genCode = () => { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 5; i++) s += A[Math.floor(Math.random() * A.length)]; return s; };

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3000); }

/* ============ Estado local ============ */
let role = null;     // 'host' | 'client'
let me = null;       // id de mi jugador
let S = null;        // último estado recibido
let offset = 0;      // reloj del anfitrión - reloj local
let connected = false;
let code = null, myName = '';
let rendered = null;
let ratingDraft = {}, predDraft = {};
let bidAmount = 1, bidKey = null, beepKey = null, lastSpinKey = null, stageMode = null;
let rateSendT = null, cfgSendT = null;
const now = () => Date.now() + offset;

/* ============ CONEXIÓN CON EL SERVIDOR ============ */
const online = p => !!(p && p.connected);
const isHost = () => !!(S && S.hostId === me);
let ws = null, pending = null, wsTries = 0;
let cid = (() => { try { let v = localStorage.getItem('cabras-cid'); if (!v) { v = uid() + uid() + uid(); localStorage.setItem('cabras-cid', v); } return v; } catch (e) { return uid() + uid() + uid(); } })();
const session = {
  get() { try { return JSON.parse(localStorage.getItem('cabras-session') || 'null'); } catch (e) { return null; } },
  set(v) { try { v ? localStorage.setItem('cabras-session', JSON.stringify(v)) : localStorage.removeItem('cabras-session'); } catch (e) {} }
};

function connectWS() {
  const url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  try { ws = new WebSocket(url); } catch (e) { setTimeout(connectWS, 2000); return; }
  ws.onopen = () => {
    wsTries = 0; connected = true;
    const ss = session.get();
    if (pending) { ws.send(JSON.stringify(pending)); }
    else if (ss && ss.code) { ws.send(JSON.stringify({ t: 'join', code: ss.code, name: ss.name, cid })); }
    renderTop();
  };
  ws.onmessage = e => { let d; try { d = JSON.parse(e.data); } catch (x) { return; } onServer(d); };
  ws.onclose = () => { connected = false; renderTop(); wsTries++; setTimeout(connectWS, Math.min(5000, 600 * wsTries)); };
}
function onServer(d) {
  if (d.t === 'state') {
    pending = null; offset = d.now - Date.now(); me = d.you;
    const first = !S; S = d.s; code = S.code;
    session.set({ code: S.code, name: (S.players.find(p => p.id === me) || {}).name || myName });
    if (first) { enterGame(); try { history.replaceState(null, '', location.pathname + '?c=' + S.code); } catch (e) {} }
    render();
  } else if (d.t === 'error') {
    pending = null;
    if (d.code === 'notfound' || d.code === 'started' || d.code === 'full' || d.code === 'name') session.set(null);
    S = null; rendered = null; showHome(d.msg);
  } else if (d.t === 'toast') toast(d.msg);
}
setInterval(() => { if (S) wsSend({ t: 'ping' }); }, 60000); // mantiene despierto el servidor gratuito
function wsSend(m) { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(m)); return true; } return false; }
function createGame(name) { myName = name; pending = { t: 'create', name, cid }; if (!wsSend(pending)) toast('Conectando con el servidor…'); }
function joinGame(c, name) { myName = name; pending = { t: 'join', code: c.toUpperCase(), name, cid }; if (!wsSend(pending)) toast('Conectando con el servidor…'); }
function leaveGame() { wsSend({ t: 'leave' }); session.set(null); S = null; me = null; rendered = null; history.replaceState(null, '', location.pathname); showHome(); }
function send(m) { if (!wsSend(m)) toast('Sin conexión. Reconectando…'); }

function lobbyCheck() {
  const c = S.config; const n = S.players.filter(p => p.connected).length;
  if (n < 2) return { ok: false, msg: 'Hacen falta al menos 2 jugadores conectados.' };
  if (c.goats < c.teamSize) return { ok: false, msg: 'Cada jugador necesita al menos tantas cabras como personas en su equipo.' };
  const need = n * c.teamSize;
  if (c.people.length < need) return { ok: false, msg: `Hay ${c.people.length} personas en la lista y con ${n} jugadores hacen falta al menos ${need}.` };
  return { ok: true, msg: `Todo listo: ${n} jugadores, ${c.people.length} personas, equipos de ${c.teamSize} y ${c.goats} cabras cada uno.` };
}

/* ============ AUDIO / VIBRACIÓN ============ */
let actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() {
  try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
  if (!actx) return;
  try { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.type = 'triangle'; g.gain.setValueAtTime(.18, actx.currentTime); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .35); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .36); } catch (e) {}
}
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) keepAwake(); });

/* ============ PANTALLA DE INICIO ============ */
function showHome(err) {
  const qc = new URLSearchParams(location.search).get('c') || '';
  const joinMode = !!qc;
  $('#app').innerHTML = `
  <div class="home">
    <h1 class="brand"><span class="goat" aria-hidden="true">🐐</span><span>Las</span><span>Cabras</span></h1>
    <p class="lede">Valorad en secreto, pujad con cabras y montad el mejor equipo. Cada uno juega desde su móvil.</p>
    ${err ? `<p class="warn" role="alert">${esc(err)}</p>` : ''}
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-join" aria-selected="${joinMode}">Unirme</button>
      <button role="tab" id="tab-new" aria-selected="${!joinMode}">Crear partida</button>
    </div>
    <div class="panel stack">
      <div><label class="f" for="nm">Tu nombre</label><input id="nm" type="text" maxlength="20" autocomplete="nickname" placeholder="Cómo te verán los demás"></div>
      <div id="codebox" ${joinMode ? '' : 'hidden'}><label class="f" for="cd">Código de la partida</label><input id="cd" class="code-input" type="text" maxlength="5" autocomplete="off" autocapitalize="characters" value="${esc(qc)}"></div>
      <button class="btn" id="go">${joinMode ? 'Entrar en la partida' : 'Crear partida'}</button>
      <p class="small muted" id="gohint">${joinMode ? 'Pide el código a quien ha creado la partida.' : 'Recibirás un código y un enlace para que los demás se unan desde su móvil.'}</p>
    </div>
  </div>`;
  let mode = joinMode ? 'join' : 'new';
  const setMode = m => {
    mode = m; $('#tab-join').setAttribute('aria-selected', m === 'join'); $('#tab-new').setAttribute('aria-selected', m === 'new');
    $('#codebox').hidden = m !== 'join'; $('#go').textContent = m === 'join' ? 'Entrar en la partida' : 'Crear partida';
    $('#gohint').textContent = m === 'join' ? 'Pide el código a quien ha creado la partida.' : 'Recibirás un código y un enlace para que los demás se unan desde su móvil.';
  };
  $('#tab-join').onclick = () => setMode('join'); $('#tab-new').onclick = () => setMode('new');
  $('#go').onclick = () => {
    unlockAudio();
    const name = $('#nm').value.trim();
    if (!name) { toast('Escribe tu nombre'); $('#nm').focus(); return; }
    $('#go').disabled = true; $('#go').textContent = 'Conectando…';
    if (mode === 'new') createGame(name);
    else { const c = $('#cd').value.trim().toUpperCase(); if (c.length !== 5) { toast('El código tiene 5 caracteres'); $('#go').disabled = false; setMode('join'); return; } joinGame(c, name); }
  };
  $('#nm').focus();
}

/* ============ JUEGO: estructura ============ */
function enterGame() {
  $('#app').innerHTML = `<header class="top" id="top"></header><div id="pausebar"></div><main id="main"></main>`;
  rendered = null;
  $('#app').onclick = onClick;
  $('#app').oninput = onInput;
  keepAwake();
}

const PHASE_LABEL = { lobby: 'Sala de espera', rating: 'Valoración secreta', auction: 'Subasta', predict: 'Predicciones', results: 'Resultados' };
function myPlayer() { return S.players.find(p => p.id === me); }
function pname(id) { const p = S.players.find(x => x.id === id); return p ? (id === me ? 'Tú' : p.name) : '?'; }
function pobj(id) { return id === me ? 'ti' : pname(id); }
function sMax(p) { const h = S.config.teamSize - p.team.length; return h > 0 ? p.goats - (h - 1) : p.goats; }

function phaseDeadline() {
  if (!S) return 0;
  if (S.phase === 'rating') return S.ratingEndsAt;
  if (S.phase === 'predict') return S.predictEndsAt;
  if (S.phase === 'auction' && S.auction) return S.auction.deadline;
  return 0;
}
function remaining(deadline) { return Math.max(0, deadline - (S && S.paused ? S.pausedAt : now())); }

function renderTop() {
  const top = $('#top'); if (!top || !S) return;
  const dl = phaseDeadline();
  const conn = connected;
  const canPause = isHost() && ['rating', 'auction', 'predict'].includes(S.phase);
  top.innerHTML = `
    <span class="dot ${conn ? '' : 'off'}" title="${conn ? 'Conectado' : 'Reconectando'}"></span>
    <span class="code" aria-label="Código de partida">${esc(S.code)}</span>
    <span class="phase">${PHASE_LABEL[S.phase]}</span>
    ${canPause ? `<button class="pausebtn" data-act="pause">${S.paused ? 'Reanudar' : 'Pausar'}</button>` : ''}
    ${dl ? `<span class="clock" data-deadline="${dl}"></span>` : ''}`;
  $('#pausebar').innerHTML = S.paused ? `<div class="paused-banner">Partida en pausa${isHost() ? '' : '. Espera a que el anfitrión la reanude.'}</div>` : (!conn ? `<div class="paused-banner">Sin conexión. Reconectando…</div>` : '');
  updateTimers();
}

function render() {
  if (!S || !$('#main')) return;
  const key = S.phase + '|' + S.round + '|' + (S.results ? S.results.key : '') + '|' + (isHost() ? 'h' : 'p');
  if (rendered !== key) {
    rendered = key; stageMode = null; lastSpinKey = null;
    if (S.phase === 'rating') ratingDraft = {};
    if (S.phase === 'predict') predDraft = {};
    BUILD[S.phase]();
    window.scrollTo(0, 0);
  }
  UPDATE[S.phase] && UPDATE[S.phase]();
  renderTop();
}

/* ============ Temporizadores ============ */
function updateTimers() {
  document.querySelectorAll('[data-deadline]').forEach(el => {
    const ms = remaining(+el.dataset.deadline); const s = Math.ceil(ms / 1000);
    el.textContent = s >= 60 ? Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0') : s;
    el.classList.toggle('low', s <= 10 && el.classList.contains('clock'));
  });
  document.querySelectorAll('[data-bar]').forEach(el => {
    const ms = remaining(+el.dataset.bar); const pct = Math.max(0, Math.min(100, ms / (+el.dataset.total) * 100));
    el.firstElementChild.style.width = pct + '%'; el.classList.toggle('low', ms < 3500);
  });
}
setInterval(updateTimers, 200);

/* ============ Fases: construcción ============ */
const BUILD = {
  lobby() {
    const host = isHost();
    $('#main').innerHTML = `
    <div class="stack">
      <div class="panel" style="text-align:center">
        <p class="muted" style="margin:0">Código para unirse</p>
        <div class="bigcode">${esc(S.code)}</div>
        <button class="btn sec" data-act="share">Compartir enlace</button>
      </div>
      <div class="panel"><h3 style="margin-bottom:10px">Jugadores <span class="muted" id="pcount"></span></h3><div class="chips" id="plist"></div></div>
      ${host ? `
      <div class="panel stack">
        <h3>Configuración</h3>
        <div><label class="f" for="cfg-people">Personas a valorar (una por línea)</label>
        <textarea id="cfg-people" placeholder="Juan&#10;María&#10;Lucía&#10;…">${esc(S.config.people.join('\n'))}</textarea></div>
        <div class="grid2">
          <div><label class="f" for="cfg-team">Personas por equipo</label><input id="cfg-team" type="number" min="1" max="10" inputmode="numeric" value="${S.config.teamSize}"></div>
          <div><label class="f" for="cfg-goats">Cabras por jugador</label><input id="cfg-goats" type="number" min="1" max="999" inputmode="numeric" value="${S.config.goats}"></div>
        </div>
        <p class="small muted">La valoración durará 10 segundos por persona de la lista.</p>
      </div>
      <p class="hint" id="lhint"></p>
      <button class="btn" data-act="start" id="startbtn">Empezar partida</button>
      ` : `
      <div class="panel"><h3 style="margin-bottom:8px">Configuración</h3><div id="cfgview"></div></div>
      <p class="muted" style="text-align:center">Esperando a que el anfitrión empiece la partida…</p>`}
      <button class="linkbtn" data-act="leave" style="display:block;margin:0 auto">Salir de la partida</button>
    </div>`;
  },
  rating() {
    const ppl = S.config.people;
    $('#main').innerHTML = `
    <div class="stack">
      <div><h2>Valora a cada persona</h2><p class="muted">De 0 a 10, en secreto. Nadie verá tus notas. Si no conoces a alguien, déjalo sin nota.</p></div>
      <div class="panel" id="ratelist">
        ${ppl.map((n, i) => `
        <div class="rate unset" data-i="${i}">
          <div class="rate-head"><span class="rate-name">${esc(n)}</span><button class="linkbtn" data-act="rate-clear" data-i="${i}" hidden>Quitar nota</button><span class="rate-val">—</span></div>
          <input type="range" min="0" max="10" step="1" value="5" data-rate="${i}" aria-label="Nota para ${esc(n)}">
          <div class="scale"><span>0</span><span>5</span><span>10</span></div>
        </div>`).join('')}
      </div>
      <div class="sticky-foot"><p class="small muted" id="rprog" style="text-align:center"></p><button class="btn" data-act="rate-submit" id="rsub">Enviar valoraciones</button></div>
    </div>`;
  },
  auction() {
    $('#main').innerHTML = `
    <div class="stack">
      <div id="stage"></div>
      <div id="action"></div>
      <div class="panel teams"><h3 style="margin-bottom:4px">Equipos</h3><div id="teams"></div></div>
      <div class="panel hist" id="hist"></div>
    </div>`;
  },
  predict() {
    const others = S.players.filter(p => p.id !== me && p.team.length);
    others.forEach(p => predDraft[p.id] = 5);
    $('#main').innerHTML = `
    <div class="stack">
      <div><h2>¿Qué media tendrá cada equipo?</h2><p class="muted">Predice la nota media de los equipos de los demás. Cuanto más te acerques, menos puntos pierdes.</p></div>
      ${S.warn ? `<p class="warn">${esc(S.warn)}</p>` : ''}
      <div class="panel" id="predlist">
        ${others.length ? others.map(p => `
        <div class="rate" data-p="${esc(p.id)}">
          <div class="rate-head"><span class="rate-name">${esc(p.name)}</span><span class="rate-val" id="pv-${esc(p.id)}">5,0</span></div>
          <p class="small muted" style="margin:2px 0 4px">${p.team.map(esc).join(', ')}</p>
          <input type="range" min="0" max="10" step="0.1" value="5" data-pred="${esc(p.id)}" aria-label="Media prevista del equipo de ${esc(p.name)}">
          <div class="scale"><span>0</span><span>5</span><span>10</span></div>
        </div>`).join('') : '<p class="muted">No hay equipos de otros jugadores que predecir.</p>'}
      </div>
      <div class="sticky-foot"><p class="small muted" id="pprog" style="text-align:center"></p><button class="btn" data-act="pred-submit" id="psub">Enviar predicción</button></div>
    </div>`;
  },
  results() {
    const R = S.results; const n = R.rows.length;
    $('#main').innerHTML = `
    <div class="stack">
      <div><h2>Ranking final</h2><p class="muted">Puntuación final = media del equipo − error medio de tus predicciones.</p></div>
      <ol class="res" id="reslist">
        ${R.rows.map((r, i) => `
        <li data-i="${i}" class="${i === 0 ? 'win' : ''}">
          <span class="pos">${i === 0 ? '🏆' : i + 1}</span>
          <span class="nm">${esc(r.id === me ? r.name + ' (tú)' : r.name)}</span>
          <span class="fin">${fmt(r.final)}</span>
          <span class="det">Media del equipo ${fmt(r.avg)}. ${r.sent ? 'Error ' + fmt(r.err) : 'Sin predicción: error ' + fmt(r.err)}</span>
          <span class="tm muted">${r.team.length ? r.team.map(esc).join(', ') : 'Sin equipo'}</span>
        </li>`).join('')}
      </ol>
      <div class="panel oracle" id="oracle">
        <h3>🔮 Mejor adivino</h3>
        <p style="margin:6px 0 0;font-size:1.15rem;font-weight:800">${R.best.length ? R.best.map(id => esc(pname(id))).join(' y ') : 'Nadie envió predicción'}</p>
        ${R.best.length ? `<p class="small muted" style="margin:0">Error medio de ${fmt(R.rows.find(r => r.id === R.best[0]).err)}</p>` : ''}
      </div>
      <div class="panel oracle" id="predtbl">${predTable()}</div>
      ${isHost() ? `<button class="btn" data-act="new-game">Nueva partida con los mismos</button><button class="btn sec" data-act="to-lobby">Volver a la sala</button>` : `<p class="muted" style="text-align:center">El anfitrión decidirá si jugáis otra.</p>`}
      <button class="linkbtn" data-act="leave" style="display:block;margin:0 auto">Salir de la partida</button>
    </div>`;
    const items = [...document.querySelectorAll('#reslist li')];
    let k = n - 1; const step = () => {
      if (!$('#oracle')) return;
      if (k < 0) { $('#oracle').classList.add('show'); setTimeout(() => $('#predtbl') && $('#predtbl').classList.add('show'), 600); return; }
      items[k].classList.add('show');
      if (k === 0) beep();
      k--; setTimeout(step, k === 0 ? 2200 : 1300);
    };
    setTimeout(step, 600);
  }
};

function predTable() {
  const R = S.results; const teams = S.players.filter(p => R.teamAvg[p.id] != null);
  const preds = Object.keys(R.preds);
  if (!preds.length) return '<h3>Predicciones</h3><p class="muted">Nadie envió predicción.</p>';
  return `<h3 style="margin-bottom:8px">Predicciones frente a la realidad</h3><div class="tbl-wrap"><table>
    <thead><tr><th>Quién predice</th>${teams.map(t => `<th>${esc(t.name)}</th>`).join('')}</tr></thead>
    <tbody>
      <tr class="real"><td>Media real</td>${teams.map(t => `<td>${fmt(R.teamAvg[t.id])}</td>`).join('')}</tr>
      ${preds.map(pid => `<tr><td>${esc(pname(pid))}</td>${teams.map(t => `<td>${t.id === pid ? '—' : fmt(R.preds[pid][t.id], 1)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
}

/* ============ Fases: actualización ============ */
const UPDATE = {
  lobby() {
    $('#pcount').textContent = '(' + S.players.length + ')';
    $('#plist').innerHTML = S.players.map(p => `<span class="chip ${p.id === me ? 'me' : ''}">${esc(p.name)}${p.id === S.hostId ? ' ⭐' : ''}${p.connected ? '' : ' (desconectado)'}</span>`).join('');
    if (isHost()) { const c = lobbyCheck(); $('#lhint').textContent = c.msg; $('#lhint').className = 'hint' + (c.ok ? '' : ' bad'); $('#startbtn').disabled = !c.ok; }
    else {
      const c = S.config;
      $('#cfgview').innerHTML = `<p style="margin:0 0 8px">Equipos de <b>${c.teamSize}</b> y <b>${c.goats}</b> cabras por jugador.</p>
        ${c.people.length ? `<div class="chips">${c.people.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div>` : '<p class="muted small" style="margin:0">El anfitrión aún no ha añadido personas.</p>'}`;
    }
  },
  rating() {
    const mine = myPlayer(); const done = S.players.filter(p => p.ratedDone).length;
    $('#rprog').textContent = `${done} de ${S.players.length} han enviado sus notas`;
    if (mine && mine.ratedDone) {
      $('#ratelist').classList.add('locked'); $('#rsub').disabled = true; $('#rsub').textContent = 'Valoraciones enviadas';
      document.querySelectorAll('[data-rate]').forEach(i => i.disabled = true);
    }
  },
  auction() { updateStage(); updateAction(); updateTeams(); updateHist(); },
  predict() {
    const mine = myPlayer(); const done = S.players.filter(p => p.predDone).length;
    $('#pprog').textContent = `${done} de ${S.players.length} han enviado su predicción`;
    if (mine && mine.predDone) {
      $('#predlist').classList.add('locked'); $('#psub').disabled = true; $('#psub').textContent = 'Predicción enviada';
      document.querySelectorAll('[data-pred]').forEach(i => i.disabled = true);
    }
  }
};

function wheelSVG(names) {
  const n = names.length, R = 148, a = 2 * Math.PI / n;
  const cols = ['var(--heno)', 'var(--pasto2)', '#F7F3E3'];
  const fs = Math.max(8, Math.min(16, 19 - n * 0.45));
  let segs = '';
  names.forEach((nm, i) => {
    let ci = i % 3; if (i === n - 1 && n > 1 && ci === 0) ci = 1; if (n === 2) ci = i;
    const fill = cols[ci], txt = ci === 1 ? '#fff' : '#1C2620';
    if (n === 1) segs += `<circle r="${R}" fill="${fill}"/>`;
    else {
      const a0 = i * a - Math.PI / 2, a1 = (i + 1) * a - Math.PI / 2;
      segs += `<path d="M0 0 L${(R * Math.cos(a0)).toFixed(2)} ${(R * Math.sin(a0)).toFixed(2)} A${R} ${R} 0 ${a > Math.PI ? 1 : 0} 1 ${(R * Math.cos(a1)).toFixed(2)} ${(R * Math.sin(a1)).toFixed(2)}Z" fill="${fill}" stroke="rgba(0,0,0,.12)" stroke-width="1"/>`;
    }
    const mid = (i + 0.5) * 360 / n - 90; const label = nm.length > 14 ? nm.slice(0, 13) + '…' : nm;
    segs += `<text transform="rotate(${mid.toFixed(2)}) translate(${R * 0.58} 0)" text-anchor="middle" dominant-baseline="middle" font-family="Nunito,system-ui,sans-serif" font-weight="800" font-size="${fs}" fill="${txt}">${esc(label)}</text>`;
  });
  return `<svg viewBox="-150 -150 300 300" role="img" aria-label="Ruleta">${segs}<circle r="20" fill="var(--pasto)"/><text text-anchor="middle" dominant-baseline="central" font-size="20">🐐</text></svg>`;
}

function updateStage() {
  const a = S.auction, el = $('#stage');
  if (a.stage === 'spinning') {
    if (lastSpinKey === a.spin.key) return;
    lastSpinKey = a.spin.key; stageMode = 'spin';
    const n = a.spin.names.length, seg = 360 / n;
    const center = (a.spin.index + 0.5) * seg; const jitter = (Math.random() - 0.5) * seg * 0.6;
    const target = 360 * 6 - center + jitter;
    el.innerHTML = `<div class="panel" style="text-align:center"><p class="muted" style="margin:0">Gira la ruleta…</p>
      <div class="wheel-wrap"><div class="pointer"></div><div class="wheel-rot" id="wrot">${wheelSVG(a.spin.names)}</div></div>
      <p class="small muted" style="margin:0">Quedan ${n} personas en la ruleta</p></div>`;
    const rot = $('#wrot'); const left = remaining(a.spin.endsAt) - 250;
    if (left <= 300) { rot.style.transform = `rotate(${target}deg)`; return; }
    requestAnimationFrame(() => requestAnimationFrame(() => {
      rot.style.transition = `transform ${left}ms cubic-bezier(.12,.67,.12,1)`; rot.style.transform = `rotate(${target}deg)`;
    }));
    return;
  }
  stageMode = a.stage;
  if (a.stage === 'pre') {
    el.innerHTML = `<div class="panel lot"><p class="kicker">Empieza la subasta</p><div class="name">${a.wheel.length} personas</div>
      <p class="muted" style="margin:0">La ruleta gira en <b data-deadline="${a.deadline}"></b> s</p>
      ${S.excluded ? `<p class="small muted" style="margin:8px 0 0">${S.excluded} sin ninguna nota quedan fuera de la ruleta.</p>` : ''}</div>`;
  } else if (a.stage === 'bidding') {
    el.innerHTML = `<div class="panel lot">
      <p class="kicker">En subasta</p><div class="name">${esc(a.lot)}</div>
      <p class="bidline">${a.leader ? `Puja actual <b>${a.bid}</b> 🐐 ${a.leader === me ? 'tuya' : 'de ' + esc(pname(a.leader))}` : (a.opener === me ? 'Abres tú con mínimo 1 🐐' : `Abre ${esc(pname(a.opener))} con mínimo 1 🐐`)}</p>
      <p style="margin:0" class="muted">${a.turn === me ? '<b style="color:var(--tinta)">Te toca a ti</b>' : `Turno de <b style="color:var(--tinta)">${esc(pname(a.turn))}</b>`}</p>
      <div class="bar" data-bar="${a.deadline}" data-total="${TURN_MS}"><i></i></div></div>`;
  } else if (a.stage === 'sold') {
    const l = a.last;
    el.innerHTML = `<div class="panel lot">
      <p class="kicker">${l.discarded ? 'Descartada' : 'Adjudicada'}</p><div class="name">${esc(l.lot)}</div>
      <p class="bidline">${l.discarded ? (l.by === me ? `Ganaste la puja con el equipo completo y pagaste <b>${l.amount}</b> 🐐. Nadie se la lleva.` : `${esc(pname(l.by))} ganó la puja con el equipo completo y pagó <b>${l.amount}</b> 🐐. Nadie se la lleva.`) : `Para ${esc(pobj(l.by))} por <b>${l.amount}</b> 🐐`}</p>
      <p class="muted" style="margin:0">Siguiente giro en <b data-deadline="${a.deadline}"></b> s</p></div>`;
  }
}

function updateAction() {
  const a = S.auction, el = $('#action'), mine = myPlayer();
  if (a.stage !== 'bidding' || !mine) { el.innerHTML = ''; return; }
  if (a.turn !== me) {
    const w = a.withdrawn.filter(id => id !== a.leader);
    el.innerHTML = a.withdrawn.includes(me) ? `<p class="muted" style="text-align:center;margin:0">Te has retirado de esta persona.</p>` :
      (w.length ? `<p class="small muted" style="text-align:center;margin:0">Retirados: ${w.map(id => esc(pname(id))).join(', ')}</p>` : '');
    return;
  }
  const max = sMax(mine), min = a.bid + 1, opening = a.leader === null;
  const key = a.spin.key + ':' + a.bid + ':' + a.turn;
  if (bidKey !== key) { bidKey = key; bidAmount = min; }
  if (beepKey !== key) { beepKey = key; beep(); }
  bidAmount = Math.max(min, Math.min(max, bidAmount));
  const full = mine.team.length >= S.config.teamSize;
  el.innerHTML = `<div class="panel yourturn">
    <h3>Te toca</h3>
    <p class="small" style="margin:4px 0 0">${opening ? 'Abres tú: tienes que pujar al menos 1 cabra.' : 'Sube la puja o retírate.'} Tu máximo es <b>${max}</b> 🐐.${full ? ' Ya tienes el equipo completo: si ganas, pagas y la persona queda descartada.' : ''}</p>
    <div class="stepper"><button data-act="bid-minus" aria-label="Una cabra menos" ${bidAmount <= min ? 'disabled' : ''}>−</button><span class="amt">${bidAmount}</span><button data-act="bid-plus" aria-label="Una cabra más" ${bidAmount >= max ? 'disabled' : ''}>+</button></div>
    <div class="row" style="margin-bottom:10px"><button class="btn sec" data-act="bid-max" style="padding:10px">Máximo (${max})</button></div>
    <div class="stack"><button class="btn dark" data-act="bid-go">Pujar ${bidAmount} 🐐</button>
    ${opening ? '' : '<button class="btn sec" data-act="withdraw">Me retiro</button>'}</div>
    <div class="bar" data-bar="${a.deadline}" data-total="${TURN_MS}"><i></i></div>
  </div>`;
  updateTimers();
}

function updateTeams() {
  const a = S.auction, ts = S.config.teamSize;
  $('#teams').innerHTML = S.order.map(id => {
    const p = S.players.find(x => x.id === id); if (!p) return '';
    const slots = Math.max(0, ts - p.team.length);
    let tag = '';
    if (a.stage === 'bidding') {
      if (a.turn === id) tag = '<span class="tag turn">Su turno</span>';
      else if (a.leader === id) tag = '<span class="tag lead">Lleva la puja</span>';
      else if (a.withdrawn.includes(id)) tag = '<span class="tag">Retirado</span>';
    }
    if (!tag && !slots) tag = '<span class="tag">Completo</span>';
    return `<div class="pl"><div class="pl-head"><span class="pl-name">${esc(p.name)}${id === me ? ' (tú)' : ''}${online(p) ? '' : ' <span class="muted small">desconectado</span>'}</span>${tag}<span class="pl-goats">${p.goats} 🐐</span></div>
      <div class="chips">${p.team.map(n => `<span class="chip ${id === me ? 'me' : ''}">${esc(n)}</span>`).join('')}${'<span class="chip slot">libre</span>'.repeat(slots)}</div></div>`;
  }).join('');
}

function updateHist() {
  const h = S.history;
  $('#hist').innerHTML = `<h3 style="margin-bottom:6px">Historial</h3>` + (h.length ? `<ul>${h.map(r => `<li>${r.discarded ? `<b>${esc(r.lot)}</b> descartada: ${r.by === me ? 'pagaste' : esc(pname(r.by)) + ' pagó'} ${r.amount} 🐐` : `<b>${esc(r.lot)}</b> para ${esc(pobj(r.by))} por ${r.amount} 🐐`}</li>`).join('')}</ul>` : '<p class="small muted" style="margin:0">Todavía no se ha subastado a nadie.</p>');
}

/* ============ Eventos ============ */
function onClick(e) {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  unlockAudio();
  const act = b.dataset.act;
  switch (act) {
    case 'pause': case 'start': case 'new-game': case 'to-lobby': if (isHost()) send({ t: 'host', act }); break;
    case 'leave': if (confirm('¿Seguro que quieres salir de la partida?')) leaveGame(); break;
    case 'share': {
      const url = location.origin + location.pathname + '?c=' + S.code;
      const txt = `Únete a Las Cabras con el código ${S.code}`;
      if (navigator.share) navigator.share({ title: 'Las Cabras', text: txt, url }).catch(() => {});
      else (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('Enlace copiado'), () => toast('Código: ' + S.code));
      break;
    }
    case 'rate-clear': {
      const i = +b.dataset.i; delete ratingDraft[S.config.people[i]];
      const row = document.querySelector(`.rate[data-i="${i}"]`); row.classList.add('unset'); row.querySelector('.rate-val').textContent = '—'; b.hidden = true;
      queueRateSend(); break;
    }
    case 'rate-submit': clearTimeout(rateSendT); send({ t: 'rate', r: ratingDraft, done: true }); break;
    case 'bid-minus': bidAmount--; updateAction(); break;
    case 'bid-plus': bidAmount++; updateAction(); break;
    case 'bid-max': bidAmount = sMax(myPlayer()); updateAction(); break;
    case 'bid-go': send({ t: 'bid', amount: bidAmount }); break;
    case 'withdraw': send({ t: 'withdraw' }); break;
    case 'pred-submit': send({ t: 'pred', g: predDraft }); break;
  }
}
function queueRateSend() { clearTimeout(rateSendT); rateSendT = setTimeout(() => send({ t: 'rate', r: ratingDraft }), 250); }
function onInput(e) {
  const t = e.target;
  if (t.dataset.rate !== undefined) {
    const i = +t.dataset.rate, n = S.config.people[i]; ratingDraft[n] = +t.value;
    const row = t.closest('.rate'); row.classList.remove('unset'); row.querySelector('.rate-val').textContent = t.value; row.querySelector('[data-act=rate-clear]').hidden = false;
    queueRateSend();
  } else if (t.dataset.pred !== undefined) {
    predDraft[t.dataset.pred] = +t.value; const v = document.getElementById('pv-' + t.dataset.pred); if (v) v.textContent = fmt(+t.value, 1);
  } else if (isHost() && ['cfg-people', 'cfg-team', 'cfg-goats'].includes(t.id)) {
    clearTimeout(cfgSendT);
    cfgSendT = setTimeout(() => send({ t: 'config', people: $('#cfg-people').value.split('\n'), teamSize: $('#cfg-team').value, goats: $('#cfg-goats').value }), 300);
  }
}

/* ============ Arranque ============ */
(() => {
  const q = new URLSearchParams(location.search).get('c');
  const ss = session.get();
  if (ss && ss.code && (!q || q.toUpperCase() === ss.code)) {
    $('#app').innerHTML = '<div class="home"><h1 class="brand"><span class="goat" aria-hidden="true">🐐</span><span>Las</span><span>Cabras</span></h1><p class="lede">Volviendo a tu partida…</p></div>';
  } else { if (ss) session.set(null); showHome(); }
  connectWS();
})();
})();
</script>
